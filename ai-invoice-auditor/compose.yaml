name: invoice-auditor

# No secrets here. Credentials come from .env via env_file (see .env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env                      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs only on first start of an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:   # image ships no curl/wget -> raw TCP + HTTP via bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]                # no volume on purpose: cache is disposable
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-erp:
    image: mock-erp:1.0
    build: ./mock_erp
    restart: unless-stopped
    env_file: .env
    ports: ["8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agent:
    image: my-agent:1.0
    build: ./agent
    restart: unless-stopped
    env_file: .env
    environment:                        # non-secret wiring only; service names, container ports
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      ERP_BASE_URL: http://mock-erp:8000
      INCOMING_DIR: /data/incoming
      REPORTS_DIR: /outputs/reports
      RULES_PATH: /app/configs/rules.yaml
    ports: ["8000:8000"]
    volumes:
      - ./data/incoming:/data/incoming
      - ./outputs/reports:/outputs/reports
      - ./configs:/app/configs:ro
    depends_on:
      postgres: {condition: service_healthy}
      qdrant:   {condition: service_healthy}
      redis:    {condition: service_healthy}
      mock-erp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  streamlit-ui:
    image: streamlit-ui:1.0
    build: ./streamlit_ui
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      AGENT_URL: http://agent:8000
      REPORTS_DIR: /outputs/reports
    ports: ["8501:8501"]
    volumes:
      - ./outputs/reports:/outputs/reports:ro
    depends_on:
      postgres: {condition: service_healthy}
      agent:    {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  qdrantdata:
